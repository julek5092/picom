backend = "glx";
vsync = true;
use-damage = true;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

#corner-radius = 12;

blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = true;
  background-fixed = true;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# rounded corners exclusions
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "name = 'dmenu'",
  "class_g = 'dmenu'",
  "override_redirect = true",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# native animation rules
animations = (
    {
        # window entrance
        triggers = [ "open", "show" ];
        preset = "slide-in";
        direction = "down";
        duration = 0.25;
        curve = "cubic-bezier(0.16, 1, 0.3, 1)";

        exclude = [
          "window_type = 'dock'",
          "override_redirect = true",
          "name = 'dmenu'",
          "class_g = 'dmenu'"
        ];
    },
    {
        # window exit
        triggers = [ "close", "hide" ];
        preset = "slide-out";
        direction = "down";
        duration = 0.28;
        curve = "cubic-bezier(0.16, 1, 0.3, 1)";

        exclude = [
          "window_type = 'dock'",
          "override_redirect = true",
          "name = 'dmenu'",
          "class_g = 'dmenu'"
        ];
    },
    {
        # layout geometry changes
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.22;
        curve = "cubic-bezier(0.16, 1, 0.3, 1)";

        exclude = [
          "window_type = 'dock'",
          "override_redirect = true",
          "name = 'dmenu'",
          "class_g = 'dmenu'"
        ];
    }
)
